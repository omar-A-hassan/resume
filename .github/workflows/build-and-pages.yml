name: Build resume and deploy pages

on:
  push:
    branches:
      - main
    paths:
      - "resume.tex"
      - "index.html"
      - ".github/workflows/build-and-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-recommended texlive-latex-extra latexmk

      - name: Build PDF
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error -jobname=OmarHassan_CV resume.tex
          latexmk -c

      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          cp OmarHassan_CV.pdf public/
          cp index.html public/

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
